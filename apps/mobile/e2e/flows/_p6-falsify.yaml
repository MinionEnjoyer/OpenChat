# _p6-falsify — falsification for permission grant
# Same pattern as p6-01-voice-channel-join-leave: join → voice view → show chat → pill → disconnect

appId: com.openchat.mobile

---
- runFlow: _login.yaml

- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- scrollUntilVisible:
    element:
      id: 'channel-#voice-general'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'channel-#voice-general'
- assertNotVisible:
    id: 'left-drawer'

# Wait for voice view (not pill — the voice view shows on join)
- extendedWaitUntil:
    visible:
      id: 'voice-channel-view'
    timeout: 30000

# Navigate to text channel → pill appears
- tapOn:
    id: 'voice-show-chat'

# Wait for pill + connection to fully establish
- extendedWaitUntil:
    visible:
      id: 'voice-pill'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'voice-pill-disconnect'
    timeout: 30000

# Now disconnect
- tapOn:
    id: 'voice-pill-disconnect'

- extendedWaitUntil:
    notVisible:
      id: 'voice-pill'
    timeout: 20000
