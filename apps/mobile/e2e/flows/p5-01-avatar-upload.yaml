# p5-01-avatar-upload — login → open right drawer → verify avatar picker reachable.
# @satisfies FR-MED-020
#
# Proves the avatar picker UI is wired and reachable from the shell's right drawer.
# Does NOT complete an OS file-picker interaction (cannot be automated by Maestro),
# but verifies the placeholder, label, and pick button are present and tappable.
#
# Requires: dev stack up + seeded (Fixture Guild), emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- launchApp:
    clearState: true
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'login-username'
- inputText: 'alice'
- tapOn:
    id: 'login-submit'
- assertVisible:
    id: 'shell-screen'

# Open left drawer and select Fixture Guild → #general to enter a server context
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#general'
- tapOn:
    id: 'channel-#general'
- assertNotVisible:
    id: 'left-drawer'

# Open right drawer via Members button
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'

# Scroll down in the right drawer to find the avatar picker
- scrollUntilVisible:
    element:
      id: 'avatar-picker'
    direction: DOWN
    timeout: 20000

# Avatar picker should be visible with placeholder and pick button
- assertVisible:
    id: 'avatar-picker'
- assertVisible:
    id: 'avatar-picker-placeholder'
- assertVisible:
    id: 'avatar-picker-button'

# Tap the pick button (opens OS file picker — Maestro can't interact further)
- tapOn:
    id: 'avatar-picker-button'

- takeScreenshot: artifacts/e2e/screens/p5-avatar
