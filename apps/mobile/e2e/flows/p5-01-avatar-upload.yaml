# p5-01-avatar-upload — login → open right drawer → verify avatar picker reachable.
# @satisfies FR-MED-020
#
# T4: Uses provisioned test world.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select provisioned server → general channel
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- assertNotVisible:
    id: 'left-drawer'

# Open right drawer via Members button
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'

# Scroll down in the right drawer to find the avatar picker
- scrollUntilVisible:
    element:
      id: 'avatar-picker'
    direction: DOWN
    timeout: 20000

# Avatar picker should be visible with placeholder and pick button
- assertVisible:
    id: 'avatar-picker'
- assertVisible:
    id: 'avatar-picker-placeholder'
- assertVisible:
    id: 'avatar-picker-button'

# Tap the pick button (opens OS file picker — Maestro can't interact further)
- tapOn:
    id: 'avatar-picker-button'

- takeScreenshot: artifacts/e2e/screens/p5-avatar
