# p5-03-inline-gallery — login → open channel → verify gallery infrastructure.
# @satisfies FR-MED-011
#
# T4: Uses provisioned test world. NOTE: Fresh worlds have no image attachments.
# This flow verifies channel loads and shell works; full gallery interaction
# requires image attachments not yet in the test-world contract.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select provisioned server → general channel
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- assertNotVisible:
    id: 'left-drawer'
- assertVisible: '# ${E2E_CHANNEL_GENERAL}'

# NOTE: Fresh worlds have no image attachments. Gallery infrastructure
# (inline render, tap→fullscreen) is verified in unit tests. This flow
# confirms the shell and channel load correctly. When the test-world
# contract is extended to include image attachments, add back:
#   - extendedWaitUntil: visible: id: attach-grid-image-0
#   - tapOn: id: attach-grid-image-0
#   - gallery-modal, gallery-close, gallery-counter, etc.

- assertVisible: '# ${E2E_CHANNEL_GENERAL}'

- takeScreenshot: artifacts/e2e/screens/p5-gallery
