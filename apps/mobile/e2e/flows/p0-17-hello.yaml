# p0-17-hello — the skeleton's launch flow against the real OpenChat package.
# @infra  (skeleton-validation flow: it proves the build/install/launch chain,
#          not any FR — product flows carrying @satisfies begin in Phase 1)
#
# Supersedes p0-smoke-hello.yaml, which launched com.android.settings because no
# OpenChat APK existed. Determinism: no sleeps; assertVisible carries its own
# timeout, and E2E=1 tells the app to freeze the clock (lib/clock).

appId: com.openchat.mobile

---
- launchApp:
    clearState: true
- assertVisible:
    id: 'hello-screen'
- assertVisible:
    id: 'hello-title'
- assertVisible: 'OpenChat'
- takeScreenshot: artifacts/e2e/screens/hello
