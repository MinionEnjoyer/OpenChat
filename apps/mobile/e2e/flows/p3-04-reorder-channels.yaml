# p3-04-reorder-channels — login → open reorder sheet → move a channel → save.
# @satisfies FR-SRV-005
#
# T4: Uses provisioned test world. Fresh world every run.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select the provisioned server
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'

# Open the reorder channels sheet
- tapOn:
    id: 'reorder-channels-button'
- assertVisible:
    id: 'channel-reorder-sheet'

# Verify general channel is present in the reorder list
- assertVisible:
    id: 'reorder-row-${E2E_CHANNEL_GENERAL}'

# Move general channel down one position
- tapOn:
    id: 'reorder-down-${E2E_CHANNEL_GENERAL}'

# Save the reorder
- tapOn:
    id: 'reorder-save'
- assertNotVisible:
    id: 'channel-reorder-sheet'

# Reopen reorder to verify the change persisted
- tapOn:
    id: 'reorder-channels-button'
- assertVisible:
    id: 'channel-reorder-sheet'
# Cancel (no permanent change to prevent cross-test interference)
- tapOn:
    id: 'reorder-cancel'
- assertNotVisible:
    id: 'channel-reorder-sheet'

- takeScreenshot: artifacts/e2e/screens/p3-reorder
