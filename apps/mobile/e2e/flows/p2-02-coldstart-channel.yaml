# p2-02-coldstart-channel — login → select channel → kill → relaunch → same channel shown.
# @satisfies FR-APP-002
#
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.
# T4: Uses provisioned test world. Fresh world every run.
# clearState on first launch gives a fresh vault; e2e:no-clear so pm clear
# doesn't wipe the session between phases.

appId: com.openchat.mobile
# e2e:no-clear

---
# ── Phase 1: Login and select a channel ──
- runFlow: _login.yaml

# Open left drawer and select the provisioned server's general channel
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'

# Channel selected — left drawer closes, chat title shows the channel
- assertNotVisible:
    id: 'left-drawer'
- assertVisible: '# ${E2E_CHANNEL_GENERAL}'

# ── Phase 2: Kill and relaunch WITHOUT clearState ──
- killApp
- launchApp

# Session restore + data load can take several seconds; extendedWaitUntil
# avoids racing on the default assertVisible timeout.
- extendedWaitUntil:
    visible:
      id: 'shell-screen'
    timeout: 30000
- assertNotVisible:
    id: 'login-screen'
- assertVisible:
    id: 'hamburger-button'

# Channel title restored from cold start — same channel as before kill
- extendedWaitUntil:
    visible: '# ${E2E_CHANNEL_GENERAL}'
    timeout: 30000

- takeScreenshot: artifacts/e2e/screens/p2-coldstart
