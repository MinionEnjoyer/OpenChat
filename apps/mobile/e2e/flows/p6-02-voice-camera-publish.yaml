# p6-02-voice-camera-publish — login → join voice → navigate to text channel → toggle camera on pill
# @satisfies FR-VOX-006
#
# Requires: dev stack up + seeded (Fixture Guild), LiveKit running, emulator reaching 10.0.2.2.
# Camera permission must be granted on emulator for video publish to work.
#
# FR-VOX-006: Camera video publish + remote video render in voice/DM calls.
# Camera toggle lives on the VoicePill, which only renders when the voice view
# is not foregrounded. Navigate to a text channel via "Show Chat" first, then
# toggle camera on the pill.

appId: com.openchat.mobile

---
# ── Phase 1: Login ──
- runFlow: _login.yaml

# ── Phase 2: Join #voice-general ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#voice-general'
- tapOn:
    id: 'channel-#voice-general'
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 3: Wait for voice view ──
- extendedWaitUntil:
    visible:
      id: 'voice-channel-view'
    timeout: 30000

# ── Phase 4: Navigate to text channel so pill appears ──
# Camera toggle is on the pill, which only shows when voice view is not foregrounded.
- tapOn:
    id: 'voice-show-chat'

# Pill appears after navigating away from voice view
- extendedWaitUntil:
    visible:
      id: 'voice-pill'
    timeout: 15000

# Controls visible when connected
- assertVisible:
    id: 'voice-pill-controls'

# ── Phase 5: Toggle camera on (FR-VOX-006) ──
- assertVisible:
    id: 'voice-pill-camera'
- tapOn:
    id: 'voice-pill-camera'

# After toggle, flip-camera button appears (only when camera is active; async — wait)
- extendedWaitUntil:
    visible:
      id: 'voice-pill-flip-camera'
    timeout: 30000

# Flip camera (verify the button works)
- tapOn:
    id: 'voice-pill-flip-camera'

# ── Phase 6: Toggle camera off ──
- tapOn:
    id: 'voice-pill-camera'

# Flip-camera button disappears when camera is off (async — wait)
- extendedWaitUntil:
    notVisible:
      id: 'voice-pill-flip-camera'
    timeout: 10000

# ── Phase 7: Disconnect ──
- tapOn:
    id: 'voice-pill-disconnect'

# Pill disappears after disconnect (async — wait for it)
- extendedWaitUntil:
    notVisible:
      id: 'voice-pill'
    timeout: 20000

- takeScreenshot: artifacts/e2e/screens/p6-voice-camera
