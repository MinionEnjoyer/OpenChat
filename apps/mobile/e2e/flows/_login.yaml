# _login — shared login subflow for E2E tests.
#
# Every flow that needs to sign in should include this instead of
# copy-pasting the login boilerplate.  clearState: true gives each flow a
# guaranteed-clean app start; no flow inherits stale tokens or UI state
# from a prior run.  If clearState alone leaves stale expo-secure-store
# tokens on some Android versions, harden that here (e.g. an explicit
# logout guard) rather than per-flow.
#
# Usage in a flow:
#   - runFlow: _login.yaml
#   # ... flow continues after shell-screen is visible
#
# Requires the following Maestro env vars (set via --env or exported):
#   E2E_USERNAME — the test user's login name (provisioned by test-world)
#
# After this subflow completes, the app is on shell-screen signed in.

appId: com.openchat.mobile
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'login-username'
- inputText: ${E2E_USERNAME}
- tapOn:
    id: 'login-submit'
- assertVisible:
    id: 'shell-screen'
