# _login — shared login subflow for E2E tests.
#
# Every flow that needs to sign in should include this instead of
# copy-pasting the login boilerplate.  This is the single point to harden
# login if clearState ever leaves stale tokens (expo-secure-store).
#
# Usage in a flow:
#   - runFlow: _login.yaml
#   # ... flow continues after shell-screen is visible
#
# Requires the following Maestro env vars (set via --env or exported):
#   E2E_USERNAME — the test user's login name (provisioned by test-world)
#
# After this subflow completes, the app is on shell-screen signed in.

appId: com.openchat.mobile
---
- launchApp:
    clearState: false
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'login-username'
- inputText: ${E2E_USERNAME}
- tapOn:
    id: 'login-submit'
- assertVisible:
    id: 'shell-screen'
