# p1-01-devlogin-shell — dev-login → Discord-shaped phone shell with drawers.
# @satisfies FR-APP-001
#
# P3-T1: Rewritten to assert drawer behavior (was: 4-column row, too weak).
# T4: Uses provisioned test world (env vars from test-world.mjs) — no hardcoded
#     server names, channel names, or usernames. Fresh world every run.
#
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.
# Determinism: no sleeps; assertVisible timeouts only. clearState gives a fresh
# vault, so this flow always starts at the login screen.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# 1. At launch, shell is visible but drawers are NOT visible.
#    Chat pane is visible and dominant.
- assertVisible:
    id: 'chat-pane'
# Left and right drawers must NOT be on screen at launch.
- assertNotVisible:
    id: 'left-drawer'
- assertNotVisible:
    id: 'right-drawer'

# Server rail items are NOT visible because they're in the drawer.
# But the hamburger button IS visible.
- assertVisible:
    id: 'hamburger-button'
- assertVisible:
    id: 'members-toggle'

# 2. Tapping hamburger opens left drawer.
#    Server rail and channel list become visible.
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- assertVisible:
    id: 'server-rail'
# Scroll until the provisioned server's rail item appears
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
# Tap the rail item to select the server (loads its channels)
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
# The channel drawer title should show the server name
- assertVisible:
    id: 'channel-drawer'
- assertVisible: ${E2E_SERVER_NAME}

# 3. Selecting a channel closes the drawer and shows the channel.
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
# After selecting a channel, left drawer closes automatically.
- assertNotVisible:
    id: 'left-drawer'
# The chat title now shows the selected channel
- assertVisible: '# ${E2E_CHANNEL_GENERAL}'

# 4. Open right drawer via Members button.
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'
# Test user should appear as a member
- assertVisible:
    id: 'member-${E2E_USERNAME}'

# 5. Tap left side of scrim to close the right drawer.
#    The right drawer occupies [450,132][1080,2400] at zIndex 20 (above the
#    scrim's zIndex 10). Tapping the scrim's left half (x < 450) avoids the
#    drawer intercepting the tap.  Toggle-close does not remove the drawer
#    from uiautomator's raw hierarchy (RN accessibilityElementsHidden isn't
#    respected by the Android view dumper), but the scrim's closeBoth path
#    triggers a re-render that does flush it.  Verified manually.
- tapOn:
    point: '20%,50%'
- assertNotVisible:
    id: 'right-drawer'

# Screenshot: chat pane full-width, no drawers open.
- takeScreenshot: artifacts/e2e/screens/p1-shell
