# p5-02-attach-picker — login → open channel → tap attach → verify picker sheet.
# @satisfies FR-MED-010
# @satisfies FR-MED-030
#
# T4: Uses provisioned test world.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select provisioned server → general channel
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- assertNotVisible:
    id: 'left-drawer'

# Verify composer is visible with the attach button
- assertVisible:
    id: 'composer-input'
- assertVisible:
    id: 'composer-attach'

# Tap attach to open the picker sheet
- tapOn:
    id: 'composer-attach'

# Verify all picker options are visible
- assertVisible:
    id: 'attach-library'
- assertVisible:
    id: 'attach-camera'
- assertVisible:
    id: 'attach-files'
- assertVisible:
    id: 'attach-cancel'

# Dismiss the picker
- tapOn:
    id: 'attach-cancel'

# Verify picker is dismissed (composer still visible)
- assertVisible:
    id: 'composer-attach'

- takeScreenshot: artifacts/e2e/screens/p5-attach-picker
