# p5-02-attach-picker — login → open channel → tap attach → verify picker sheet.
# @satisfies FR-MED-010
# @satisfies FR-MED-030
#
# Proves the attachment picker is reachable from the composer and shows all
# expected source options (Photo Library, Camera, Files, Cancel).
# Does NOT complete a file-picker interaction (OS-level, not automatable),
# but verifies the entire picker UI is wired and dismissible.
#
# FR-MED-030 coverage: the "original" toggle is part of AttachmentTray
# which only renders when attachments are in the queue. Since Maestro
# cannot interact with the OS file picker, we verify the attach button
# is present and the picker sheet is fully wired. The compression unit
# tests cover the actual resize/quality logic.
#
# Requires: dev stack up + seeded (Fixture Guild), emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select Fixture Guild → #general
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#general'
- tapOn:
    id: 'channel-#general'
- assertNotVisible:
    id: 'left-drawer'

# Verify composer is visible with the attach button
- assertVisible:
    id: 'composer-input'
- assertVisible:
    id: 'composer-attach'

# Tap attach to open the picker sheet
- tapOn:
    id: 'composer-attach'

# Verify all picker options are visible
- assertVisible:
    id: 'attach-library'
- assertVisible:
    id: 'attach-camera'
- assertVisible:
    id: 'attach-files'
- assertVisible:
    id: 'attach-cancel'

# Dismiss the picker
- tapOn:
    id: 'attach-cancel'

# Verify picker is dismissed (composer still visible)
- assertVisible:
    id: 'composer-attach'

- takeScreenshot: artifacts/e2e/screens/p5-attach-picker
