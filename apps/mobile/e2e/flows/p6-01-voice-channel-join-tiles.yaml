# p6-01-voice-channel-join-tiles — login → join voice channel → voice view + tile grid + controls + occupancy
# @satisfies FR-VOX-002, FR-VOX-004
#
# Requires: dev stack up + seeded (Fixture Guild), LiveKit running, emulator reaching 10.0.2.2.
# This flow does its own login so it can run independently.
#
# FR-VOX-002: Participant tiles with speaking rings and mute badges.
# FR-VOX-004: Voice channel occupancy shown live in channel list.

appId: com.openchat.mobile

---
# ── Phase 1: Login ──
- runFlow: _login.yaml

# ── Phase 2: Navigate to Fixture Guild and join #voice-general ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#voice-general'
- tapOn:
    id: 'channel-#voice-general'

# Left drawer closes
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 3: Verify full voice view appears ──
- extendedWaitUntil:
    visible:
      id: 'voice-channel-view'
    timeout: 30000

# Voice controls bar (mute/deafen/speaker/disconnect) is visible in voice view
- assertVisible:
    id: 'voice-controls'

# Disconnect button present in voice view controls
- assertVisible:
    id: 'voice-control-disconnect'

# ── Phase 4: Verify participant tile grid (FR-VOX-002) ──
# The tile grid shows self as a participant (rendered inside voice view)
- extendedWaitUntil:
    visible:
      id: 'voice-tile-grid'
    timeout: 30000

# Mute using voice view controls (not pill — pill is hidden while voice view shows)
- tapOn:
    id: 'voice-control-mute'

# Verify mute badge appears on own tile
- assertVisible:
    id: 'voice-tile-muted'

# Unmute
- tapOn:
    id: 'voice-control-mute'

# ── Phase 5: Verify channel occupancy in channel list (FR-VOX-004) ──
# Re-open left drawer to see channel list with participant names
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'

# The voice channel row should show "alice" as connected participant
- extendedWaitUntil:
    visible: 'alice'
    timeout: 20000

# ── Phase 6: Navigate away → pill, then leave ──
# Close drawer by tapping voice channel again → voice view re-appears
- tapOn:
    id: 'channel-#voice-general'

# VoiceChannelView is visible (still connected)
- assertVisible:
    id: 'voice-channel-view'

# Tap "Show Chat" to navigate to text channel → pill appears
- tapOn:
    id: 'voice-show-chat'

# Pill is visible (voice view dismissed, still in call)
- extendedWaitUntil:
    visible:
      id: 'voice-pill'
    timeout: 15000

# Disconnect from pill
- tapOn:
    id: 'voice-pill-disconnect'

# Pill disappears after disconnect (async — wait for it)
- extendedWaitUntil:
    notVisible:
      id: 'voice-pill'
    timeout: 20000

- takeScreenshot: artifacts/e2e/screens/p6-voice-tiles
