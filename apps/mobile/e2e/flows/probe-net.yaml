# @infra  Connectivity probe: emulator→host via 10.0.2.2
# Hit the API health endpoint from inside the emulator via Chrome,
# then assert the response JSON is visible on screen.
#
# Requires: emulator booted, Docker stack running, API on 10.0.2.2:3001
appId: com.android.chrome
---
- launchApp:
    clearState: true
- assertVisible: "Chrome"
- inputText: "http://10.0.2.2:3001/api/health"
- pressKey: Enter
- assertVisible: "ok"