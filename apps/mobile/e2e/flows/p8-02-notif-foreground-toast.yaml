# p8-02-notif-foreground-toast — login → verify notification infrastructure for foreground handling
# @satisfies FR-NOTIF-004
#
# T4: Uses provisioned test world.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
# ── Phase 1: Login ──
- runFlow: _login.yaml

# ── Phase 2: Navigate to provisioned server, select general channel ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 3: Verify notif-settings bell is reachable ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'

- assertVisible:
    id: 'notif-settings-button'

# Open notification settings to verify the overlay renders
- tapOn:
    id: 'notif-settings-button'
- assertVisible:
    id: 'notif-settings-done'

# Close
- tapOn:
    id: 'notif-settings-done'
- assertNotVisible:
    id: 'notif-settings-done'

- takeScreenshot: artifacts/e2e/screens/p8-notif-foreground
