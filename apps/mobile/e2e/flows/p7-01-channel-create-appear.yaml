# p7-01-channel-create-appear — create channel → verify it appears in the list.
# @satisfies FR-SRV-009
#
# FR-SRV-009 acceptance criterion: "create channel on A → appears on B ≤2s
# WITHOUT refetch-all".  A single-device Maestro flow can verify the "appears
# on A" leg: the channel form submits → query invalidation → channel list
# updates.  The cross-user ("on B") realtime propagation requires a second
# device and is NOT covered here.
#
# Requires: dev stack up + seeded (Fixture Guild), emulator reaching 10.0.2.2.
# Determinism: no sleeps; assertVisible timeouts only. clearState on launch.

appId: com.openchat.mobile

---
# ── Phase 1: Login ──
- launchApp:
    clearState: true
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'login-username'
- inputText: 'alice'
- tapOn:
    id: 'login-submit'
- assertVisible:
    id: 'shell-screen'

# ── Phase 2: Open left drawer, select Fixture Guild ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-drawer'
- assertVisible: 'Fixture Guild'

# ── Phase 3: Create a new channel ──
- tapOn:
    id: 'create-channel-button'
- assertVisible:
    id: 'channel-form-sheet'

# Type the channel name
- tapOn:
    id: 'channel-form-name'
- inputText: 'e2e-test-channel'

# Select TEXT type (it is the default, but assert and tap to be explicit)
- assertVisible:
    id: 'channel-form-type-text'
- tapOn:
    id: 'channel-form-type-text'

# Submit the form
- tapOn:
    id: 'channel-form-submit'

# ── Phase 4: Verify the new channel appears in the list ──
# The channel drawer is still open. The new channel should be visible.
# testID is channel-${channel.name} as returned by the API.
- assertVisible:
    id: 'channel-e2e-test-channel'

# ── Phase 5: Select the new channel, verify it loads ──
- tapOn:
    id: 'channel-e2e-test-channel'
- assertNotVisible:
    id: 'left-drawer'

# Chat title shows the channel name
- assertVisible: '# e2e-test-channel'

# The chat pane should show messages (empty is fine, but it should load)
- assertVisible:
    id: 'chat-messages'

- takeScreenshot: artifacts/e2e/screens/p7-channel-create
