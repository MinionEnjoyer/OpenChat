# msg-rich-markdown-mentions — @mention autocomplete + send markdown-formatted message.
# @satisfies FR-MSG-007, FR-MSG-008
#
# Requires: dev stack up + seeded (Fixture Guild), emulator reaching 10.0.2.2.
# FR-MSG-007: message with markdown syntax is sent, delivered, and content preserved.
# FR-MSG-008: @mention autocomplete appears, candidate selected, mention sent + highlighted.
# NOTE: FR-MSG-007 visual formatting (bold/italic) is not rendered on mobile yet;
# the acceptance criterion is snapshot unit tests. This flow proves compose → send → display.

appId: com.openchat.mobile

---
# ── Phase 1: Login and navigate to #general ──
- runFlow: _login.yaml

- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#general'
- tapOn:
    id: 'channel-#general'
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 2: Compose a mention + markdown message ──
- tapOn:
    id: 'composer-input'

# Type "@b" to trigger mention autocomplete (bob is a member)
- inputText: '@b'

# Assert mention picker appears with bob as a candidate
- assertVisible:
    id: 'mention-picker'
- assertVisible:
    id: 'mention-bob'

# Tap bob to insert the mention
- tapOn:
    id: 'mention-bob'

# Complete the message with markdown syntax
- inputText: ' **bold** *italic* ~~strike~~'

# Send
- tapOn:
    id: 'composer-send'

# ── Phase 3: Verify the message appears ──
# The mention should render with @bob highlighted; the markdown text is preserved
- assertVisible: '@bob'

# ── Phase 4: Verify the mention picker dismissed after sending ──
- assertNotVisible:
    id: 'mention-picker'

- takeScreenshot: artifacts/e2e/screens/msg-rich-markdown-mentions
