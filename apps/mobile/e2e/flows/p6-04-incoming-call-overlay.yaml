# p6-04-incoming-call-overlay — test user receives incoming DM call from friend → overlay shows → accept → pill.
# @satisfies FR-VOX-005
#
# T4: Uses provisioned test world. Friend joins the DM voice channel via API
# using the friend's token from E2E_FRIEND_TOKEN, triggering call.ring to
# the test user's WebSocket.
#
# Requires: dev stack up + provisioned world, LiveKit running, emulator.

appId: com.openchat.mobile

---
# ── Phase 1: Login as test user ──
- runFlow: _login.yaml

# ── Phase 2: Trigger incoming call by having friend join the DM ──
# Uses E2E_FRIEND_TOKEN and E2E_DM_CHANNEL_ID from the provisioned world.
- runScript:
    content: |
      const API = 'http://10.0.2.2:3030/api';
      async function main() {
        const token = '${E2E_FRIEND_TOKEN}';
        const dmChannelId = '${E2E_DM_CHANNEL_ID}';
        // Join the voice channel as friend — triggers call.ring to test user
        const joinResp = await fetch(API + '/voice/' + dmChannelId + '/join', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (joinResp.status !== 201) throw new Error('Join failed: ' + joinResp.status);
      }
      main().catch(function(e) { throw e; });

# ── Phase 3: Assert incoming call overlay appeared ──
- extendedWaitUntil:
    visible:
      id: 'incoming-call-overlay'
    timeout: 20000

# Verify the overlay shows the caller name and controls
- assertVisible: 'Incoming Call'
- assertVisible:
    id: 'incoming-call-accept'
- assertVisible:
    id: 'incoming-call-decline'

# ── Phase 4: Tap Accept → join the call → VoicePill appears ──
- tapOn:
    id: 'incoming-call-accept'

# Overlay dismissed
- assertNotVisible:
    id: 'incoming-call-overlay'

# VoicePill appears after joining
- extendedWaitUntil:
    visible:
      id: 'voice-pill'
    timeout: 15000

# ── Phase 5: Disconnect ──
- tapOn:
    id: 'voice-pill-disconnect'

- extendedWaitUntil:
    notVisible:
      id: 'voice-pill'
    timeout: 20000

- takeScreenshot: artifacts/e2e/screens/p6-incoming-call
