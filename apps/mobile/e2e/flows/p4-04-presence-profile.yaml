# p4-04-presence-profile — dev-login → select server → open right drawer → verify presence
# dots, status picker, and member profile sheet.
# @satisfies FR-SOC-004, FR-SOC-006
#
# T4: Uses provisioned test world. Fresh world every run.
# displayName assertion: dev-login users have displayName === username.
# Requires: dev stack up + provisioned world.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# ── Phase 1: Select provisioned server → general channel ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'
- assertVisible:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- tapOn:
    id: 'channel-${E2E_CHANNEL_GENERAL}'
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 2: Open right drawer (members + profile) ──
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'

# ── Phase 3: Verify own presence and profile elements ──
- assertVisible:
    id: 'status-indicator'
- assertVisible:
    id: 'presence-picker'
- assertVisible:
    id: 'profile-displayname'

# ── Phase 4: Open status picker, verify options, dismiss ──
- tapOn:
    id: 'presence-picker'
- assertVisible:
    id: 'presence-option-online'
- assertVisible:
    id: 'presence-option-away'
- assertVisible:
    id: 'presence-option-dnd'
- assertVisible:
    id: 'presence-option-invisible'
- tapOn:
    id: 'presence-backdrop'

# ── Phase 5: Verify member list and presence dots ──
- assertVisible:
    id: 'members-drawer'
# Test user should appear as a member (with a presence dot)
- assertVisible:
    id: 'member-${E2E_USERNAME}'

# ── Phase 6: Tap test user → verify profile sheet ──
- tapOn:
    id: 'member-${E2E_USERNAME}'
- assertVisible:
    id: 'member-profile-sheet'
# Profile sheet shows the member's display name (=== username for dev-login users)
- assertVisible: ${E2E_USERNAME}
# Dismiss profile sheet
- tapOn:
    id: 'member-profile-close'
- assertNotVisible:
    id: 'member-profile-sheet'

# ── Phase 7: Close right drawer via scrim tap ──
- tapOn:
    point: '20%,50%'
- assertNotVisible:
    id: 'right-drawer'
