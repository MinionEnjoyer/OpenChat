# p3-05-members-kick-leave — login → open member list → verify members →
#   tap member profile → verify kick button on others, leave on self.
# @satisfies FR-SRV-007 FR-SRV-008
#
# Uses only the seeded Fixture Guild (non-destructive — does not actually
# kick or leave, only verifies the UI actions are reachable).
#
# Requires: dev stack up + seeded, emulator reaching 10.0.2.2.
# This flow does its own login so it can run independently.

appId: com.openchat.mobile

---
- launchApp:
    clearState: true
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'login-username'
- inputText: 'alice'
- tapOn:
    id: 'login-submit'
- assertVisible:
    id: 'shell-screen'

# Open left drawer and select Fixture Guild
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'

# Open the right drawer (members list) via the Members toggle
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'

# Verify seeded users appear in the member list
- assertVisible:
    id: 'member-alice'
- assertVisible:
    id: 'member-bob'
- assertVisible:
    id: 'member-dave'

# ── Tap bob: profile sheet should appear with kick button (alice is owner) ──
- tapOn:
    id: 'member-bob'
# The MemberProfileSheet opens — verify kick button is visible
- assertVisible:
    id: 'member-profile-kick'

# Close profile sheet by tapping scrim (backdrop in RN modal)
- tapOn:
    point: '20%,50%'

# ── Tap alice (self): profile sheet should show leave button instead ──
- tapOn:
    id: 'member-alice'
- assertVisible:
    id: 'member-profile-leave'
# Ensure kick button is NOT shown for self
- assertNotVisible:
    id: 'member-profile-kick'

# Close the right drawer via scrim tap
- tapOn:
    point: '20%,50%'
- assertNotVisible:
    id: 'right-drawer'

- takeScreenshot: artifacts/e2e/screens/p3-members
