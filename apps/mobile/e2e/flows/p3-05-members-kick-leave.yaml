# p3-05-members-kick-leave — login → open member list → verify members + friend →
#   tap member profile → verify kick button on others, leave on self.
# @satisfies FR-SRV-007 FR-SRV-008
#
# T4: Uses provisioned test world. Verifies test user + friend.
# NOTE: The original seed had 4 members (alice, bob, carol, dave).
# The test world contract provides one friend. This flow now verifies
# the test user and the friend. Multi-member coverage is deferred to the
# backend's richer world provisioning.
# Non-destructive — does not actually kick or leave.
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select the provisioned server
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'

# Open the right drawer (members list) via the Members toggle
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'

# Verify test user and friend appear in the member list
- assertVisible:
    id: 'member-${E2E_USERNAME}'
- assertVisible:
    id: 'member-${E2E_FRIEND_USERNAME}'

# ── Tap friend: profile sheet should appear with kick button (test user is owner) ──
- tapOn:
    id: 'member-${E2E_FRIEND_USERNAME}'
- assertVisible:
    id: 'member-profile-kick'
- tapOn:
    point: '20%,50%'

# ── Tap self: profile sheet should show leave button instead ──
- tapOn:
    id: 'member-${E2E_USERNAME}'
- assertVisible:
    id: 'member-profile-leave'
- assertNotVisible:
    id: 'member-profile-kick'

# Close the right drawer via scrim tap
- tapOn:
    point: '20%,50%'
- assertNotVisible:
    id: 'right-drawer'

- takeScreenshot: artifacts/e2e/screens/p3-members
