# screen-readiness: Right Drawer (members)
# Opens the right drawer from shell and verifies the members panel.
# Starts from shell (post-login), leaves right drawer open.

appId: com.openchat.mobile
---
# Dismiss any open left drawer (tap right-side scrim)
- tapOn:
    point: '85%,50%'
- tapOn:
    id: 'members-toggle'
- assertVisible:
    id: 'right-drawer'
- assertVisible:
    id: 'members-drawer'
