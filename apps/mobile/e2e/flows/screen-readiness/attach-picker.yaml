# screen-readiness: AttachPicker
# Opens the attachment picker from the composer-attach (+) button.
# Does NOT switch servers/channels — the composer is always visible on shell.

appId: com.openchat.mobile
---
- assertVisible:
    id: 'shell-screen'
- assertVisible:
    id: 'composer-attach'
- tapOn:
    id: 'composer-attach'
- assertVisible:
    id: 'attach-library'
