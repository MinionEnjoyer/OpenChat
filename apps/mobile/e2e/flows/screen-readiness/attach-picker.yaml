# screen-readiness: AttachPicker
# Opens the attachment picker from the composer in a channel.
# Navigates to #general in Fixture Guild, then taps composer-attach.

appId: com.openchat.mobile
---
- runFlow: _go-shell.yaml
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'channel-#general'
- tapOn:
    id: 'channel-#general'
# Left drawer closes, composer is visible
- assertVisible:
    id: 'composer-attach'
- tapOn:
    id: 'composer-attach'
- assertVisible:
    id: 'attach-library'
