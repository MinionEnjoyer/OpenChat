# screen-readiness: PollCreate
# Opens the poll creation modal from the composer in a channel.
# The app restores last-selected server/channel; composer-poll is always
# present on the shell screen — no drawer navigation needed.
# Emulator-5556 verified: tap composer-poll → poll-create-question visible.

appId: com.openchat.mobile
---
- runFlow: _go-shell.yaml
- assertVisible:
    id: 'composer-poll'
- tapOn:
    id: 'composer-poll'
- assertVisible:
    id: 'poll-create-question'