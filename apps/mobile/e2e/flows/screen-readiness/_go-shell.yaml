# _go-shell — return to shell screen from any navigation state.
# Used inline by screen-readiness flows to recover before navigating.
# Uses only scrim taps; adb-based back handling is done by the runner.

appId: com.openchat.mobile
---
# Dismiss left drawer (tap right scrim)
- tapOn:
    point: '85%,50%'
# Dismiss right drawer (tap left scrim)
- tapOn:
    point: '15%,50%'
- tapOn:
    point: '15%,50%'
- assertVisible:
    id: 'shell-screen'
