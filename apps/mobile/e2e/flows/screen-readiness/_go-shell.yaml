# _go-shell — return to shell screen from any navigation state.
#
# Strategy:
#  1. Relaunch the app (same task, no clearState) to bring it to foreground
#     and dismiss system-level back-navigation that exited to launcher.
#  2. Assert shell-screen is visible.
#
# On tablets with persistent drawer, shell-screen is always visible
# unless a full-screen overlay is active. Overlays are dismissed by
# the individual flow steps (back within the flow) or by relaunch.
#
# Note: Do NOT use back — on the shell screen, one back exits the app.

appId: com.openchat.mobile
---
- launchApp:
    clearState: false
- assertVisible:
    id: 'shell-screen'