# screen-readiness: ChannelForm
# Opens the channel creation form from the left drawer channel list footer.
# Does NOT switch servers — uses whichever server is active after login.

appId: com.openchat.mobile
---
- assertVisible:
    id: 'shell-screen'
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- assertVisible:
    id: 'create-channel-button'
- tapOn:
    id: 'create-channel-button'
- assertVisible:
    id: 'channel-form-sheet'
