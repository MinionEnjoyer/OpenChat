# screen-readiness: ServerSettingsScreen
# Opens server settings from the channel header (gear icon).
# Requires Fixture Guild to be in the rail.

appId: com.openchat.mobile
---
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-Fixture Guild'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-Fixture Guild'
- assertVisible:
    id: 'server-settings-button'
- tapOn:
    id: 'server-settings-button'
- assertVisible:
    id: 'server-settings-screen'
