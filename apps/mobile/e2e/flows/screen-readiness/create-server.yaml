# screen-readiness: CreateServerScreen
# Opens create-server from the left drawer rail.
# Inline recovery: back dismisses inbox, then opens left drawer.
# Leaves create-server screen open.

appId: com.openchat.mobile
---
# Dismiss inbox full-screen overlay
- back
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- tapOn:
    id: 'rail-create-server'
- assertVisible:
    id: 'create-server-screen'
