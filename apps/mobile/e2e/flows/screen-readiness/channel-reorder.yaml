# screen-readiness: ChannelReorderScreen
# Opens the channel reorder sheet from the left drawer channel list footer.
# Does NOT switch servers — uses whichever server is active after login.

appId: com.openchat.mobile
---
- assertVisible:
    id: 'shell-screen'
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- assertVisible:
    id: 'reorder-channels-button'
- tapOn:
    id: 'reorder-channels-button'
- assertVisible:
    id: 'channel-reorder-sheet'
