# p3-02-rename-server — login → open server settings → rename → verify.
# @satisfies FR-SRV-003
#
# T4: Uses provisioned test world. Renames the server, verifies, then renames it
# back. Each run gets its own world, so the rename-back is for intra-flow cleanliness.
#
# Requires: dev stack up + provisioned world, emulator reaching 10.0.2.2.

appId: com.openchat.mobile

---
- runFlow: _login.yaml

# Open left drawer and select the provisioned server
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- scrollUntilVisible:
    element:
      id: 'rail-server-${E2E_SERVER_NAME}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'rail-server-${E2E_SERVER_NAME}'

# Open server settings (gear icon in channel header)
- tapOn:
    id: 'server-settings-button'
- assertVisible:
    id: 'server-settings-screen'

# Rename the server
- tapOn:
    id: 'server-settings-name'
# Clear existing text and type new name
- eraseText: 100
- inputText: '${E2E_SERVER_NAME} Renamed'
- tapOn:
    id: 'server-settings-rename-save'

# Return to shell via cancel
- tapOn:
    id: 'server-settings-cancel'
- assertNotVisible:
    id: 'server-settings-screen'

# Open left drawer and verify the name changed in the rail
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- assertVisible:
    id: 'rail-server-${E2E_SERVER_NAME} Renamed'

# Channel drawer title should show new name
- assertVisible: '${E2E_SERVER_NAME} Renamed'

# Rename back to original so other flows see the expected name
- tapOn:
    id: 'server-settings-button'
- assertVisible:
    id: 'server-settings-screen'
- tapOn:
    id: 'server-settings-name'
- eraseText: 100
- inputText: ${E2E_SERVER_NAME}
- tapOn:
    id: 'server-settings-rename-save'
- tapOn:
    id: 'server-settings-cancel'

- takeScreenshot: artifacts/e2e/screens/p3-rename-server
