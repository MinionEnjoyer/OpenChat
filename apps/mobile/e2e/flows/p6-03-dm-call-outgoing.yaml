# p6-03-dm-call-outgoing — login → open DM with friend → tap call button → VoicePill appears → disconnect.
# @satisfies FR-VOX-005
#
# T4: Uses provisioned test world. DM channel exists between test user and friend.
# Requires: dev stack up + provisioned world, LiveKit running, emulator.

appId: com.openchat.mobile

---
# ── Phase 1: Login ──
- runFlow: _login.yaml

# ── Phase 2: Open left drawer and navigate to DM with friend ──
- tapOn:
    id: 'hamburger-button'
- assertVisible:
    id: 'left-drawer'
- tapOn:
    id: 'rail-dm'
- assertVisible:
    id: 'dm-section'
- scrollUntilVisible:
    element:
      text: ${E2E_FRIEND_USERNAME}
    direction: DOWN
    timeout: 20000
- tapOn: ${E2E_FRIEND_USERNAME}
- assertNotVisible:
    id: 'left-drawer'

# ── Phase 3: Assert call button is visible and tap it ──
- assertVisible:
    id: 'call-button'
- tapOn:
    id: 'call-button'

# ── Phase 4: Assert VoicePill appears ──
- extendedWaitUntil:
    visible:
      id: 'voice-pill'
    timeout: 15000

# ── Phase 5: Disconnect ──
- tapOn:
    id: 'voice-pill-disconnect'
- extendedWaitUntil:
    notVisible:
      id: 'voice-pill'
    timeout: 20000

- takeScreenshot: artifacts/e2e/screens/p6-dm-call-outgoing
