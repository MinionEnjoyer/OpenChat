<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenChat Spinner Preview</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 42%, #172838 0, #0c121a 44%, #070b10 100%);
        color: #eaf4ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .preview {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: min(100%, 420px);
        padding: 40px 54px 48px;
        border: 1px solid rgba(115, 190, 255, 0.15);
        border-radius: 24px;
        background: rgba(13, 22, 31, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .option-name {
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(105, 196, 255, 0.09);
        color: #9fb0c1;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      @keyframes oc-spin { to { transform: rotate(1turn); } }
      @keyframes oc-orbit-glow {
        0%, 100% { opacity: 0.42; filter: blur(12px); }
        50% { opacity: 0.82; filter: blur(20px); }
      }
      @keyframes oc-soft-glow {
        0%, 100% {
          box-shadow:
            calc(-1 * var(--oc-glow-offset)) 0 var(--oc-glow-radius) rgba(32, 145, 255, 0.1),
            var(--oc-glow-offset) 0 var(--oc-glow-radius) rgba(24, 218, 174, 0.09);
        }
        50% {
          box-shadow:
            calc(-1 * var(--oc-glow-offset)) 0 var(--oc-glow-radius) rgba(32, 145, 255, 0.18),
            var(--oc-glow-offset) 0 var(--oc-glow-radius) rgba(24, 218, 174, 0.16);
        }
      }
      .oc-spinner {
        --oc-orbit-colors: conic-gradient(
          transparent 0deg 7deg,
          #14e3ba 7deg,
          #11cda8 78deg,
          #07836f 173deg,
          transparent 173deg 187deg,
          #0756a8 187deg,
          #117ee9 254deg,
          #2fb7ff 343deg,
          transparent 353deg 360deg
        );
        --oc-orbit-mask: radial-gradient(
          farthest-side,
          transparent 0 83%,
          #000 84% 97%,
          transparent 98% 100%
        );
        --oc-glow-offset: 5px;
        --oc-glow-radius: 22px;
        position: relative;
        width: min(100%, 276px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: url('/logo.png') center / 58% 58% no-repeat;
        isolation: isolate;
        animation: oc-soft-glow 2.4s ease-in-out infinite;
      }
      .oc-spinner::before,
      .oc-spinner::after {
        content: '';
        position: absolute;
        inset: 5%;
        border-radius: 50%;
        background:
          radial-gradient(circle, transparent 0 84%, rgba(199, 255, 255, 0.82) 85%, transparent 88%),
          var(--oc-orbit-colors);
        -webkit-mask: var(--oc-orbit-mask);
        mask: var(--oc-orbit-mask);
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .oc-spinner::before {
        animation: oc-spin 1.15s linear infinite, oc-orbit-glow 1.8s ease-in-out infinite;
      }
      .oc-spinner::after {
        animation: oc-spin 1.15s linear infinite;
      }
      .label {
        color: #9fb0c1;
        font-size: 16px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="option-name">SPINNER</div>
      <div class="oc-spinner" aria-label="Loading"></div>
      <div class="label">CONNECTING…</div>
    </main>
  </body>
</html>
