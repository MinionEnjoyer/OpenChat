server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Upload limits are operator-controlled at the API/external-ingress layers.
  # Zero disables nginx's implicit body ceiling so this bundled proxy does not
  # reject an otherwise permitted upload before it reaches those controls.
  client_max_body_size 0;

  location / { try_files $uri /index.html; }

  # YouTube rejects anonymous embedded clients. The desktop shell loads these
  # same-origin shim documents so their nested player requests carry the server's
  # HTTPS origin even though the outer Tauri page uses a custom scheme.
  location ~ ^/yt(-party)?\.html$ {
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Pass NPM's original proto (https) through so the API sets Secure cookies correctly.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }
}
