components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Express session cookie (dev-login or OIDC sets this)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/token or dev-login (x-added-by P1)

  schemas:
    DevLoginResponse:
      description: User fields plus bearer tokens (x-added-by P1-02; explicit rather than allOf so exact-key validation holds)
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        status: { type: string, nullable: true }
        friendCode: { type: string, nullable: true }
        serverLayout: { nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, enum: [3600] }
      required: [id, username, accessToken, refreshToken, expiresIn]

    UploadedAttachment:
      description: Broker attachment ref matching web Attachment shape (x-added-by: P5)
      type: object
      properties:
        shareAssetId: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        size: { type: number }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        width: { type: number, nullable: true }
        height: { type: number, nullable: true }
        durationMs: { type: number, nullable: true }
      required: [shareAssetId, filename, mimeType, size, url, thumbnailUrl, width, height, durationMs]
      x-added-by: P5

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, enum: [3600] }
        refreshToken: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, expiresIn, refreshToken, user]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        friendCode:
          type: string
          nullable: true
          description: Lazily backfilled; may be null
      required: [id, username]

    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        myPermissions:
          type: string
          description: BigInt serialized as decimal string
        iconUrl:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name]

    ServerSound:
      description: A soundboard clip for a server (FR-SOUND-001)
      x-verified-against: live API 2026-07-26
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        emoji:
          type: string
