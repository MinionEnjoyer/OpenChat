components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Express session cookie (dev-login or OIDC sets this)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/token or dev-login (x-added-by P1)

  schemas:
    DevLoginResponse:
      description: User fields plus bearer tokens (x-added-by P1-02; explicit rather than allOf so exact-key validation holds)
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        status: { type: string, nullable: true }
        friendCode: { type: string, nullable: true }
        serverLayout: { nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, enum: [3600] }
      required: [id, username, accessToken, refreshToken, expiresIn]

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, enum: [3600] }
        refreshToken: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, expiresIn, refreshToken, user]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        friendCode:
          type: string
          nullable: true
          description: Lazily backfilled; may be null
      required: [id, username]

    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        myPermissions:
          type: string
          description: BigInt serialized as decimal string
      required: [id, name]

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
        nonce:
          type: string
          nullable: true
        editedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        pinned:
          type: boolean
        poll:
          $ref: '#/components/schemas/Poll'
        createdAt:
          type: string
          format: date-time
      required: [id, channelId, authorId, content]

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        shareAssetId:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: string
          pattern: "^\\d+$"
          description: BigInt serialized as decimal string
        url:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationMs:
          type: integer
          nullable: true
      required: [id, messageId, shareAssetId, filename, size, url]

    AttachmentInput:
      type: object
      properties:
        shareAssetId:
          type: string
        url:
          type: string
        thumbnailUrl:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
      required: [shareAssetId, url]

    Reaction:
      type: object
      properties:
        emoji:
          type: string
        userId:
          type: string
          format: uuid
      required: [emoji, userId]

    Poll:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              voterIds:
                type: array
                items:
                  type: string
                  format: uuid
        allowMultiple:
          type: boolean

    SearchResult:
      x-added-by: P7
      type: object
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        content:
          type: string
          description: Full message content
        snippet:
          type: string
          description: HTML-highlighted snippet (ts_headline output)
        createdAt:
          type: string
          format: date-time
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            displayName:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
          required: [id, username]
      required: [id, channelId, content, snippet, createdAt, author]

    SearchResponse:
      x-added-by: P7
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching messages
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required: [total, results]