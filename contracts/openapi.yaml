openapi: 3.1.0
info:
  title: OpenChat API
  version: 0.1.0
  description: >
    REST API for OpenChat — derived from Phase 0 observed behavior (E-experiments,
    characterization tests). Every operation cites its evidence. Routes marked
    `x-unverified: true` carry a note explaining what would verify them.
servers:
  - url: http://localhost:3001/api
    description: Dev stack

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ── Health ──
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [health]
      security: []
      responses:
        '200':
          description: OK
      x-evidence: stack health check

  # ── Config ──
  /config:
    get:
      operationId: getConfig
      summary: Client config (requires auth — characterized)
      tags: [config]
      responses:
        '200':
          description: >
            Client config (shareBaseUrl, jellyfinUrl).
            Requires auth. Characterized: returns 401 without session cookie.
            A pre-auth public subset (`GET /config/public`) will be added in Phase 1
            per DR-002.
      x-evidence: provider.spec.ts#config-auth-char, DRIFT-LOG 2026-07-21

  # ── Auth ──
  /auth/login:
    get:
      operationId: oidcLogin
      summary: OIDC login redirect
      tags: [auth]
      security: []
      responses:
        '302':
          description: Redirect to OIDC provider
      x-evidence: E10

  /auth/callback:
    get:
      operationId: oidcCallback
      summary: OIDC callback
      tags: [auth]
      security: []
      responses:
        '302':
          description: Redirect to app on success
      x-evidence: E10

  /auth/logout:
    post:
      operationId: logout
      summary: Destroy session
      tags: [auth]
      responses:
        '201':
          description: >
            Returns `{endSessionUrl: string}` and destroys the local session.
            Characterized: returns 201 (not 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  endSessionUrl:
                    type: string
                required: [endSessionUrl]
      x-evidence: auth.spec.ts#logout, E1

  /auth/dev-login:
    post:
      operationId: devLogin
      summary: Dev-only test login (DEV_AUTH=1 required)
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              example:
                username: alice
      responses:
        '201':
          description: >
            Returns user object with standard shape PLUS bearer tokens
            (x-added-by P1-02). Sets session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginResponse'
        '404':
          description: Not found in production (route gated by DEV_AUTH)
      x-evidence: auth.spec.ts#dev-login, integration/bearer-auth.spec.ts, E1

  /auth/token:
    post:
      operationId: issueToken
      summary: Bearer token issuance for native clients (x-added-by P1-01)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grantType: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                codeVerifier: { type: string }
                redirectUri: { type: string }
                refreshToken: { type: string }
              required: [grantType]
      responses:
        '201':
          description: Tokens issued (refresh rotation with family revocation on reuse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Unknown grantType or missing fields
        '401':
          description: Invalid, spent, or family-revoked refresh token
      x-evidence: integration/bearer-auth.spec.ts

  /auth/oidc-metadata:
    get:
      operationId: getOidcMetadata
      summary: Public OIDC metadata for native clients (x-added-by P1-03, DR-002)
      tags: [auth]
      security: []
      responses:
        '200':
          description: Issuer/clientId/nativeRedirectUri/scopes. Never contains secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string, nullable: true }
                  clientId: { type: string, nullable: true }
                  nativeRedirectUri: { type: string }
                  scopes: { type: array, items: { type: string } }
                required: [issuer, clientId, nativeRedirectUri, scopes]
      x-evidence: integration/bearer-auth.spec.ts

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No session
      x-evidence: auth.spec.ts#me, E1
    patch:
      operationId: updateMe
      summary: Update current user profile
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 32
                displayName:
                  type: string
                  maxLength: 80
                avatarUrl:
                  type: string
                  maxLength: 1000
                status:
                  type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No session
      x-evidence: auth.spec.ts#patch-me, E1

  /auth/server-layout:
    put:
      operationId: updateServerLayout
      summary: Save server navigation layout
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                layout:
                  type: object
                  properties:
                    folders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          color:
                            type: integer
                          serverIds:
                            type: array
                            items:
                              type: string
                          collapsed:
                            type: boolean
                        required: [id, name, color, serverIds]
                    order:
                      type: array
                      items:
                        type: string
                  required: [folders]
                  x-added-by: P3-01
      responses:
        '200':
          description: Layout accepted
      x-evidence: auth.spec.ts#server-layout, E1

  /auth/ws-ticket:
    get:
      operationId: getWsTicket
      summary: Mint WebSocket connection ticket
      tags: [auth]
      responses:
        '200':
          description: >
            Returns `{ticket: string, expiresAt: string}`. Ticket is used as
            `?ticket=<value>` query param on WS connect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                required: [ticket, expiresAt]
        '401':
          description: No session
      x-evidence: auth.spec.ts#ws-ticket, E2

  # ── Servers ──
  /servers/permissions:
    get:
      operationId: getPermissionCatalog
      summary: Get server permission catalog
      tags: [servers]
      responses:
        '200':
          description: >
            Permission catalog with bitfield values. Bits are serialized as
            decimal strings (BigInt safety).
      x-evidence: roles.spec.ts#permissions, E3

  /servers:
    get:
      operationId: listServers
      summary: List current user's servers
      tags: [servers]
      responses:
        '200':
          description: Array of servers with myPermissions (string)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
      x-evidence: servers.spec.ts#list, E1
    post:
      operationId: createServer
      summary: Create server
      tags: [servers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        '201':
          description: Created server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
      x-evidence: servers.spec.ts#create, E3

  /servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getServer
      summary: Get server by ID
      tags: [servers]
      responses:
        '200':
          description: Server detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '403':
          description: Non-member
        '404':
          description: Not found
      x-evidence: servers.spec.ts#get, E1
    patch:
      operationId: updateServer
      summary: Update server (owner only)
      tags: [servers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated server
      x-evidence: servers.spec.ts#update, E3
    delete:
      operationId: deleteServer
      summary: Delete server (owner only)
      tags: [servers]
      responses:
        '200':
          description: Deleted
      x-evidence: servers.spec.ts#delete, E3

  /servers/{id}/sounds:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSounds
      summary: List server sounds
      tags: [servers]
      responses:
        '200':
          description: Array of sound objects
      x-evidence: servers.spec.ts#sounds, E3
    post:
      operationId: createSound
      summary: Upload server sound
      tags: [servers]
      responses:
        '201':
          description: Created sound
      x-evidence: servers.spec.ts#sounds, E3
    delete:
      operationId: deleteSound
      summary: Delete server sound
      tags: [servers]
      responses:
        '200':
          description: Deleted
      x-evidence: servers.spec.ts#sounds, E3
    patch:
      operationId: updateSound
      summary: Update server sound
      tags: [servers]
      responses:
        '200':
          description: Updated
      x-unverified: true
      x-note: "PATCH has same guard as POST+DELETE but no dedicated characterization test"
      x-evidence: "route exists in controller; no characterization test"

  /servers/{id}/channels:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listChannels
      summary: List channels in server
      tags: [servers]
      responses:
        '200':
          description: Array of channel objects
      x-evidence: servers.spec.ts#channels, E3
    post:
      operationId: createChannel
      summary: Create channel
      tags: [servers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [TEXT, VOICE]
              required: [name, type]
      responses:
        '201':
          description: Created channel
      x-evidence: servers.spec.ts#channels-create, E3

  /servers/{id}/channels/reorder:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: reorderChannels
      summary: Reorder channels
      tags: [servers]
      responses:
        '200':
          description: Reorder accepted
      x-evidence: servers.spec.ts#channels-reorder, E3

  /servers/{id}/channels/{channelId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteChannel
      summary: Delete channel
      tags: [servers]
      responses:
        '200':
          description: Deleted
      x-evidence: servers.spec.ts#channel-delete, E3

  /servers/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMembers
      summary: List server members
      tags: [servers]
      responses:
        '200':
          description: Array of member objects with user and roleIds
      x-evidence: servers.spec.ts#members, E3
    post:
      operationId: addMember
      summary: Add member to server
      tags: [servers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
              required: [userId]
      responses:
        '201':
          description: Member added
      x-evidence: helpers.ts#seed, E3

  /servers/{id}/members/me:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: leaveServer
      summary: Leave server
      tags: [servers]
      responses:
        '200':
          description: Left (may also return 500 - characterized as-is)
        '500':
          description: Characterized edge case
      x-evidence: servers.spec.ts#leave, E3

  /servers/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: kickMember
      summary: Kick member from server
      tags: [servers]
      responses:
        '200':
          description: Kicked (may also return 500 - characterized)
        '500':
          description: Characterized edge case
      x-evidence: servers.spec.ts#kick, E3

  /servers/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRoles
      summary: List server roles
      tags: [servers]
      responses:
        '200':
          description: Array of role objects
      x-evidence: roles.spec.ts#list, E3
    post:
      operationId: createRole
      summary: Create role
      tags: [servers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: integer
                permissions:
                  type: string
                  description: Bitfield as decimal string
              required: [name, permissions]
      responses:
        '201':
          description: Created role
      x-evidence: roles.spec.ts#create, E3

  /servers/{id}/roles/{roleId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRole
      summary: Update role
      tags: [servers]
      responses:
        '200':
          description: Updated
      x-evidence: roles.spec.ts#create, E3
    delete:
      operationId: deleteRole
      summary: Delete role
      tags: [servers]
      responses:
        '200':
          description: Deleted
      x-evidence: roles.spec.ts#create, E3

  /servers/{id}/members/{userId}/roles/{roleId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: assignMemberRole
      summary: Assign role to member
      tags: [servers]
      responses:
        '200':
          description: Role assigned
      x-evidence: roles.spec.ts#member-role, E3
    delete:
      operationId: removeMemberRole
      summary: Remove role from member
      tags: [servers]
      responses:
        '200':
          description: Role removed
      x-evidence: roles.spec.ts#member-role, E3

  # ── Invites ──
  /servers/{id}/invites:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createInvite
      summary: Create server invite
      tags: [invites]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses:
                  type: integer
                expiresInHours:
                  type: number
      responses:
        '201':
          description: >
            Returns `{code, serverId, expiresAt, maxUses}`. No `id` field at
            top level (characterized).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  serverId:
                    type: string
                    format: uuid
                  expiresAt:
                    type: string
                    format: date-time
                  maxUses:
                    type: integer
      x-evidence: invites.spec.ts#create, E3

  /invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewInvite
      summary: Preview invite (public, no auth)
      tags: [invites]
      security: []
      responses:
        '200':
          description: Invite preview with server info
        '404':
          description: Invalid code
      x-evidence: invites.spec.ts#preview, E3

  /invites/{code}/accept:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acceptInvite
      summary: Accept invite (join server)
      tags: [invites]
      responses:
        '200':
          description: Joined server
      x-evidence: invites.spec.ts#accept, E3

  # ── Server Invitations (notification-driven) ──
  /server-invitations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acceptServerInvitation
      summary: Accept server invitation from notifications
      tags: [notifications]
      responses:
        '200':
          description: Accepted
      x-evidence: invites.spec.ts#notif-accept

  /server-invitations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: declineServerInvitation
      summary: Decline server invitation from notifications
      tags: [notifications]
      responses:
        '200':
          description: Declined
      x-evidence: invites.spec.ts#notif-decline

  # ── Messages ──
  /channels/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMessages
      summary: List channel messages (newest-first)
      tags: [messages]
      parameters:
        - name: before
          in: query
          schema:
            type: string
            format: uuid
          description: Cursor — message ID to page before
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: >
            Max messages to return. Service fetches limit+1 internally for
            hasMore detection — actual response may contain limit items.
      responses:
        '200':
          description: >
            Paginated messages (newest-first). May return up to limit+1 items
            (service internal behavior).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
      x-evidence: messages.spec.ts#list, E6
    post:
      operationId: sendMessage
      summary: Send message to channel
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Message text (required)
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttachmentInput'
                nonce:
                  type: string
                  description: Client idempotency key (echoed in response)
              required: [content]
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Empty content
      x-evidence: messages.spec.ts#send, E2

  # ── Individual Message ──
  /messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: editMessage
      summary: Edit message (author only)
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        '200':
          description: Updated message (sets editedAt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Non-author
      x-evidence: messages.spec.ts#edit, E3
    delete:
      operationId: deleteMessage
      summary: Soft-delete message
      tags: [messages]
      responses:
        '200':
          description: Soft-deleted (sets deletedAt, content cleared, attachments preserved)
      x-evidence: messages.spec.ts#delete, E3

  # ── Reactions ──
  /messages/{id}/reactions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addReaction
      summary: Add reaction to message (characterized: returns 201)
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
              required: [emoji]
      responses:
        '201':
          description: "Message with updated reactions array. Characterized: returns 201 (not 200)."
      x-evidence: reactions.spec.ts#add, E7
    delete:
      operationId: removeReaction
      summary: Remove reaction
      tags: [messages]
      responses:
        '200':
          description: Message with updated reactions
      x-evidence: reactions.spec.ts#remove, E7

  # ── Pins ──
  /channels/{id}/pins:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listPinnedMessages
      summary: List pinned messages in channel
      tags: [messages]
      responses:
        '200':
          description: Array of pinned messages
      x-evidence: pins-polls.spec.ts#pins-list, E7

  /messages/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: togglePin
      summary: Toggle pin on message
      tags: [messages]
      responses:
        '200':
          description: Message with updated pin state
      x-evidence: pins-polls.spec.ts#pin, E7

  # ── Polls ──
  /channels/{id}/polls:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createPoll
      summary: Create poll in channel
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: string
              required: [question, options]
      responses:
        '201':
          description: Created poll message
      x-evidence: pins-polls.spec.ts#poll-create, E7

  /polls/options/{optionId}/vote:
    parameters:
      - name: optionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: votePoll
      summary: Vote on poll option (characterized: returns 201)
      tags: [messages]
      responses:
        '201':
          description: >
            Poll message with updated voterIds. Characterized: returns 201
            (not 200).
      x-evidence: pins-polls.spec.ts#vote, E7

  # ── Read Receipts ──
  /channels/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: markRead
      summary: Mark channel as read (no WS event emitted)
      tags: [messages]
      responses:
        '200':
          description: Read receipt recorded
      x-evidence: messages.spec.ts#read, E7

  # ── DMs ──
  /dms:
    get:
      operationId: listDMs
      summary: List DM channels
      tags: [dms]
      responses:
        '200':
          description: Array of DM objects
      x-evidence: dms-friends.spec.ts#dms, E1
    post:
